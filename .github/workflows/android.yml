name: LoreGuard APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  apk:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Name APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk LoreGuard.apk
          keytool -printcert -jarfile LoreGuard.apk > /tmp/loreguard-cert.txt
          grep -q "CN=LoreGuard" /tmp/loreguard-cert.txt
          if grep -q "CN=Android Debug" /tmp/loreguard-cert.txt; then
            echo "Release APK is signed with a debug key, so Android will reject it as an update" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: LoreGuard
          path: LoreGuard.apk
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: LoreGuard ${{ github.ref_name }}
          files: LoreGuard.apk
          generate_release_notes: true
